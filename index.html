    <!-- Critical CSS for Hero Section - LCP Optimization -->
    <style>
      /* Critical CSS for Hero Section - LCP Optimization */

      /* CSS Variables - Essential for Hero */
      :root {
        --radius: 0.625rem;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --primary: oklch(0.922 0 0);
        --primary-foreground: oklch(0.205 0 0);
        --secondary: oklch(0.269 0 0);
        --secondary-foreground: oklch(0.985 0 0);
        --accent: oklch(0.269 0 0);
        --accent-foreground: oklch(0.985 0 0);
        --ring: oklch(0.556 0 0);
        --input: oklch(1 0 0 / 15%);
        /* Actual Tailwind color values from @theme inline */
        --color-primary: #00ff7f;
        --color-secondary: #05a7a6;
        --color-background: #101913;
      }

      /* Base styles */
      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      body {
        background-color: var(--background);
        color: var(--foreground);
        overflow-x: hidden;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }

      /* Hero Container */
      .hero-container {
        width: 100%;
        height: calc(100vh - 50px);
        background-color: var(--color-background);
        position: relative;
        overflow: hidden;
      }

      /* Hero Background Image */
      .hero-bg-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      /* Hero Content Overlay */
      .hero-content-overlay {
        position: relative;
        z-index: 10;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Hero Content Container */
      .hero-content-container {
        text-align: center;
        max-width: 56rem; /* max-w-4xl */
        margin: 0 auto;
        padding: 0 1rem; /* px-4 */
        display: flex;
        flex-direction: column;
        gap: 1.5rem; /* gap-6 */
      }

      /* Hero Subtitle */
      .hero-subtitle {
        font-size: 1.25rem; /* text-xl */
        font-weight: 300; /* font-light */
        color: white;
        filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04))
          drop-shadow(0 4px 3px rgb(0 0 0 / 0.1)); /* drop-shadow-lg */
        margin: 0;
      }

      /* Hero Main Title */
      .hero-main-title {
        font-size: 2.25rem; /* text-4xl */
        font-weight: 900; /* font-black */
        color: var(--color-primary);
        line-height: 1.2;
        filter: drop-shadow(0 10px 8px rgb(0 0 0 / 0.04))
          drop-shadow(0 4px 3px rgb(0 0 0 / 0.1)); /* drop-shadow-lg */
        display: flex;
        flex-direction: column;
        gap: 0.75rem; /* gap-3 */
        margin: 0;
      }

      /* Hero Title Row */
      .hero-title-row {
        display: flex;
        gap: 0.75rem; /* gap-3 */
        justify-content: center;
      }

      /* Hero Gradient Text */
      .hero-gradient-text {
        background: linear-gradient(to left, var(--color-secondary), #fff);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
      }

      /* Fallback for browsers that don't support background-clip: text */
      .hero-gradient-text-fallback {
        background: none;
        color: var(--color-secondary);
        -webkit-text-fill-color: initial;
      }

      /* Hero Description */
      .hero-description {
        font-size: 1.25rem; /* text-xl */
        color: rgba(255, 255, 255, 0.9); /* text-white/90 */
        font-weight: 300; /* font-light */
        filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07))
          drop-shadow(0 2px 2px rgb(0 0 0 / 0.06)); /* drop-shadow-md */
        max-width: 42rem; /* max-w-2xl */
        margin: 0 auto;
      }

      /* Hero Buttons Container */
      .hero-buttons-container {
        display: flex;
        gap: 2.5rem; /* gap-10 */
        justify-content: center;
      }

      /* Hero Button Base */
      .hero-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        border-radius: calc(var(--radius) - 2px);
        font-size: 0.875rem;
        transition: all 0.2s;
        cursor: pointer;
        text-decoration: none;
        border: none;
        outline: none;
        height: 2.25rem; /* h-9 */
        padding: 0.5rem 1rem; /* px-4 py-2 */
      }

      /* Hero Button Outline Variant */
      .hero-button-outline {
        border: 2px solid rgba(0, 255, 127, 0.5);
        color: var(--color-primary);
        background-color: var(--color-background);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      }

      .hero-button-outline:hover {
        background-color: var(--color-primary);
        color: var(--color-background);
      }

      /* Hero Button Default Variant */
      .hero-button-default {
        background-color: var(--color-primary);
        color: var(--color-background);
        box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        font-weight: 700; /* font-bold */
      }

      .hero-button-default:hover {
        background-color: rgba(0, 255, 127, 0.9);
      }

      /* Responsive Design - Mobile First */
      @media (min-width: 768px) {
        .hero-subtitle {
          font-size: 2.25rem; /* md:text-4xl */
        }

        .hero-main-title {
          font-size: 3.75rem; /* md:text-6xl */
          flex-direction: row; /* md:flex-row */
        }
      }

      /* Focus styles for accessibility */
      .hero-button:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }

      /* Ensure text is readable */
      .hero-subtitle,
      .hero-description {
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      }

      /* Prevent layout shift */
      .hero-bg-image {
        will-change: transform;
      }

      /* Optimize for LCP */
      .hero-container {
        contain: layout style paint;
      }

      /* Additional LCP optimizations */
      .hero-bg-image {
        content-visibility: auto;
        contain-intrinsic-size: 100vw 100vh;
      }

      /* Prevent layout shift during image load */
      .hero-container::before {
        content: '';
        display: block;
        width: 100%;
        height: calc(100vh - 50px);
        background-color: var(--color-background);
        position: absolute;
        top: 0;
        left: 0;
        z-index: -1;
      }

      /* Optimize text rendering */
      .hero-subtitle,
      .hero-main-title,
      .hero-description {
        font-display: swap;
        text-rendering: optimizeSpeed;
      }
    </style>

    <!-- Browser compatibility script for gradient text -->
    <script>
      // Check if browser supports background-clip: text
      function supportsBackgroundClipText() {
        const testEl = document.createElement('div')
        testEl.style.backgroundClip = 'text'
        testEl.style.webkitBackgroundClip = 'text'
        return (
          testEl.style.backgroundClip === 'text' ||
          testEl.style.webkitBackgroundClip === 'text'
        )
      }

      // Apply fallback class if gradient text is not supported
      document.addEventListener('DOMContentLoaded', function () {
        if (!supportsBackgroundClipText()) {
          const gradientElements = document.querySelectorAll(
            '.hero-gradient-text'
          )
          gradientElements.forEach((el) => {
            el.classList.add('hero-gradient-text-fallback')
          })
        }
      })
    </script>
